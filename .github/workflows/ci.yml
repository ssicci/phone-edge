name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # adb 와 scrcpy 서버는 저장소에 없으므로 공식 출처에서 받아 해시를 검증한다.
      - name: 외부 도구 받기
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 에 들어 있는 Android SDK 에 도우미 앱이 쓰는 플랫폼과 빌드 도구를 더한다 (docs/companion.md 의 Build 참고).
      - name: Android SDK 준비
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'ANDROID_HOME 이 설정되어 있지 않습니다.' }
          $mgr = Get-ChildItem -Path $sdk -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mgr) { throw "sdkmanager 를 찾지 못했습니다: $sdk" }
          (1..30 | ForEach-Object { 'y' }) | & $mgr.FullName --licenses | Out-Null
          & $mgr.FullName 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager 실패' }

      # PR·push 에서는 비밀 값 없이 debug 빌드만 확인한다 (서명된 release 는 태그 릴리스에서만 만든다).
      - name: 폰 도우미 앱 빌드 (debug)
        shell: pwsh
        working-directory: android
        run: ./gradlew.bat --no-daemon assembleDebug

      - name: 빌드
        run: dotnet build src/Twinput.App/Twinput.App.csproj -c Release

      - name: 앱 테스트
        run: dotnet test tests/Twinput.App.Tests/Twinput.App.Tests.csproj -c Release

      - name: 폰 연결 엔진 테스트
        run: dotnet test tests/Twinput.Phone.Tests/Twinput.Phone.Tests.csproj -c Release
