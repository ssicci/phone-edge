name: Release

# v0.1.0 같은 태그를 push 하면 설치 파일과 업데이트 패키지를 만들어 GitHub 릴리스로 올린다.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161   # src/PhoneEdge.App 이 참조하는 Velopack 패키지 버전과 같게 유지한다

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 태그·Directory.Build.props·CHANGELOG 일치 확인
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "태그가 vX.Y.Z 형식이 아닙니다: $version" }
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'Directory.Build.props 에 <Version> 이 없습니다.' }
          if ($Matches[1] -ne $version) { throw "Directory.Build.props 버전($($Matches[1]))이 태그($version)와 다릅니다." }
          ./scripts/Get-ChangelogEntry.ps1 -Version $version -OutFile RELEASE_NOTES.md
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 외부 도구 받기
        shell: pwsh
        run: ./tools/fetch-tools.ps1

      - name: scrcpy 서버 버전 일치 확인
        shell: pwsh
        run: |
          $cfg = Get-Content tools/versions.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $src = Get-Content src/PhoneEdge.Phone/AdbPhoneLinkOptions.cs -Raw -Encoding UTF8
          if ($src -notmatch ('ServerVersion\s*\{\s*get;\s*init;\s*\}\s*=\s*"' + [regex]::Escape($cfg.scrcpyServer.version) + '"')) {
            throw "tools/versions.json 의 scrcpy 서버 버전($($cfg.scrcpyServer.version))과 AdbPhoneLinkOptions.ServerVersion 이 다릅니다."
          }

      - name: 테스트
        run: |
          dotnet test tests/PhoneEdge.App.Tests/PhoneEdge.App.Tests.csproj -c Release
          dotnet test tests/PhoneEdge.Phone.Tests/PhoneEdge.Phone.Tests.csproj -c Release

      - name: publish (self-contained win-x64)
        run: dotnet publish src/PhoneEdge.App/PhoneEdge.App.csproj -c Release -r win-x64 --self-contained -o publish

      - name: vpk 설치
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # 델타 업데이트를 만들려면 이전 릴리스 패키지가 필요하다. 첫 릴리스에는 받을 것이 없다.
      - name: 이전 릴리스 받기
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir Releases

      - name: 패키지 만들기
        shell: pwsh
        run: |
          vpk pack --packId PhoneEdge --packVersion $env:VERSION --packDir publish --mainExe PhoneEdge.exe `
            --packTitle PhoneEdge --packAuthors PhoneEdge --icon src/PhoneEdge.App/Assets/app.ico `
            --shortcuts StartMenuRoot --releaseNotes RELEASE_NOTES.md --outputDir Releases

      - name: GitHub 릴리스 올리기
        shell: pwsh
        run: |
          vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir Releases --publish --releaseName "PhoneEdge v$env:VERSION" --tag "v$env:VERSION"
