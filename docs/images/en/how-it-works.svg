<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
  <title id="t">How Twinput moves your mouse and keyboard to the phone</title>
  <desc id="d">The cursor leaves the right edge of the laptop screen and appears at the left edge of the phone screen. Pushing past the phone's left edge brings it back.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --screen:#eaf1fb; --body:#2b3340; --line:#8a94a3; --blue:#1e88e5; --green:#2eb84b; --orange:#f59e0b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9aa4af; --screen:#1c2a3d; --body:#c9d1d9; --line:#6e7681; --blue:#58a6ff; --green:#3fb950; --orange:#d29922; }
    }
    .bg { fill:var(--bg); }
    text { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg); }
    .muted { fill:var(--muted); font-size:13px; }
    .title { font-size:15px; font-weight:600; }
    .body { fill:var(--body); }
    .screen { fill:var(--screen); }
    .cable { stroke:var(--line); stroke-width:3; fill:none; stroke-linecap:round; }
    .go { stroke:var(--blue); stroke-width:3; fill:none; }
    .back { stroke:var(--green); stroke-width:3; fill:none; stroke-dasharray:7 5; }
    .gotxt { fill:var(--blue); font-size:14px; font-weight:600; }
    .backtxt { fill:var(--green); font-size:14px; font-weight:600; }
    .cursor { fill:var(--fg); stroke:var(--bg); stroke-width:1.5; }
    .key { fill:var(--bg); stroke:var(--line); stroke-width:1.5; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--green)"/></marker>
  </defs>
  <rect class="bg" width="800" height="330"/>

  <!-- laptop -->
  <rect class="body" x="30" y="70" width="290" height="190" rx="10"/>
  <rect class="screen" x="42" y="82" width="266" height="166" rx="4"/>
  <path class="body" d="M10 260 H340 L328 278 H22 Z"/>
  <text class="title" x="175" y="305" text-anchor="middle">Laptop mode</text>
  <text class="muted" x="175" y="52" text-anchor="middle">Windows laptop</text>
  <!-- cursor on laptop -->
  <path class="cursor" d="M262 150 L262 178 L270 171 L276 184 L281 182 L275 169 L286 169 Z"/>
  <line x1="288" y1="164" x2="316" y2="164" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- phone -->
  <rect class="body" x="650" y="32" width="140" height="240" rx="20"/>
  <rect class="screen" x="660" y="48" width="120" height="208" rx="10"/>
  <text class="title" x="720" y="305" text-anchor="middle">Phone mode</text>
  <text class="muted" x="720" y="20" text-anchor="middle">Android phone (USB)</text>
  <path class="cursor" d="M666 150 L666 178 L674 171 L680 184 L685 182 L679 169 L690 169 Z"/>

  <!-- 1: go -->
  <path class="go" d="M330 120 H640" marker-end="url(#ab)"/>
  <text class="gotxt" x="485" y="106" text-anchor="middle">① Push past the right edge</text>
  <text class="muted" x="485" y="140" text-anchor="middle">mouse + keyboard now go to the phone</text>

  <!-- 2: back -->
  <path class="back" d="M650 214 H340" marker-end="url(#ag)"/>
  <text class="backtxt" x="495" y="200" text-anchor="middle">② Push past the phone's left edge</text>
  <text class="muted" x="495" y="234" text-anchor="middle">or press Ctrl+Alt+Esc anytime</text>

  <!-- cable -->
  <path class="cable" d="M260 278 C260 322 668 322 668 276"/>
  <text class="muted" x="440" y="20" text-anchor="middle">Phone on another side? Set it in “Phone position…”.</text>
  <text class="muted" x="464" y="328" text-anchor="middle">USB cable</text>
</svg>
